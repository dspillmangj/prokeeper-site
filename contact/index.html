<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Contact Athletic Sales - ProKeeper</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
    <header>
        <div class="nav-container">
            <a href="/" class="logo">
                <img src="/images/icon-white.svg" alt="ProKeeper" style="height: 28px; width: auto;">
                <span>PROKEEPER</span>
            </a>
            <nav>
                <ul class="nav-links">
                    <li><a href="/features/">Features</a></li>
                    <li><a href="/pricing/">Pricing</a></li>
                    <li><a href="https://docs.prokeeper.taligent.dev">Docs</a></li>
                    <li><a href="/contact/" style="color: #fff;">Contact</a></li>
                </ul>
            </nav>
            <div style="display: flex; gap: 0.75rem;">
                <a href="https://app.prokeeper.taligent.dev/login" class="btn btn-secondary">Sign In</a>
                <a href="https://app.prokeeper.taligent.dev/register" class="btn btn-primary">Get Started Free</a>
            </div>
        </div>
    </header>

    <main style="max-width: 600px; margin: 0 auto; padding: 4rem 1.5rem;">
        <div class="section-title" style="margin-bottom: 2rem;">
            <h2>Contact Athletic Sales & Support</h2>
            <p>Schedule a live demonstration or request athletic department licensing.</p>
        </div>

        <div style="background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 1.5rem; padding: 2.5rem 2rem;">
            <form action="#" method="POST" style="display: flex; flex-direction: column; gap: 1.25rem;">
                <div>
                    <label style="display: block; font-size: 0.75rem; font-weight: 700; text-transform: uppercase; color: var(--text-secondary); margin-bottom: 0.5rem;">Full Name</label>
                    <input type="text" required placeholder="Coach / Athletic Director" style="width: 100%; padding: 0.75rem 1rem; background: var(--bg-primary); border: 1px solid var(--border-color); border-radius: 0.75rem; color: #fff; font-size: 0.875rem;">
                </div>

                <div>
                    <label style="display: block; font-size: 0.75rem; font-weight: 700; text-transform: uppercase; color: var(--text-secondary); margin-bottom: 0.5rem;">School / Organization Email</label>
                    <input type="email" required placeholder="director@school.edu" style="width: 100%; padding: 0.75rem 1rem; background: var(--bg-primary); border: 1px solid var(--border-color); border-radius: 0.75rem; color: #fff; font-size: 0.875rem;">
                </div>

                <div>
                    <label style="display: block; font-size: 0.75rem; font-weight: 700; text-transform: uppercase; color: var(--text-secondary); margin-bottom: 0.5rem;">Message</label>
                    <textarea rows="4" placeholder="Tell us about your athletic program or tournament needs..." style="width: 100%; padding: 0.75rem 1rem; background: var(--bg-primary); border: 1px solid var(--border-color); border-radius: 0.75rem; color: #fff; font-size: 0.875rem;"></textarea>
                </div>

                <button type="submit" class="btn btn-primary" style="padding: 0.875rem; width: 100%; font-size: 0.9375rem; margin-top: 0.5rem;">
                    Submit Inquiry
                </button>
            </form>
        </div>
    </main>

    <footer>
        <div class="footer-bottom" style="border: none; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem;">
            <div>&copy; 2026 ProKeeper Systems. All rights reserved.</div>
            <div style="display: flex; gap: 1.5rem;">
                <a href="https://prokeeper.taligent.dev" style="color: var(--text-secondary); text-decoration: underline;">Home</a>
                <a href="https://app.prokeeper.taligent.dev" style="color: var(--text-secondary); text-decoration: underline;">App</a>
                <a href="https://docs.prokeeper.taligent.dev" style="color: var(--text-secondary); text-decoration: underline;">Docs</a>
            </div>
        </div>
    </footer>
</body>
</html>
